name: Build ikun 26.1.2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain
      - name: Verify release
        run: python3 tools/verify_release.py build/libs/ikun-1.0.0-26.1.2.jar
      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: ikun-26.1.2
          path: build/libs/ikun-1.0.0-26.1.2.jar
          if-no-files-found: error
